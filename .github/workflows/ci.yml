name: ci
on: [push, pull_request, workflow_dispatch]
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  probe:
    name: XCTest + protocol + fault matrix
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: scripts/ci/unit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-reports, path: build/reports }
  ui:
    name: XCUITest (iPhone)
    # One macOS runner at a time: free accounts share about 5 across all repos.
    needs: probe
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-reports, path: build/reports }
